plugins { id 'com.android.application' }
android {
    namespace 'com.eightsian.pos'
    compileSdk 35
    defaultConfig {
        applicationId 'com.eightsian.pos'
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName '0.6.21'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('POS_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('POS_ANDROID_KEYSTORE'))
                storePassword System.getenv('POS_ANDROID_STORE_PASSWORD')
                keyAlias '8sian-pos'
                keyPassword System.getenv('POS_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('POS_ANDROID_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}
tasks.register('preparePosAssets', Exec) {
    workingDir '../..'
    commandLine 'node', 'scripts/prepare-android.cjs'
    inputs.dir '../../web'
    inputs.dir '../../desktop'
    inputs.dir '../bridge'
    outputs.dir 'src/main/assets'
}
tasks.named('preBuild').configure { dependsOn 'preparePosAssets' }
